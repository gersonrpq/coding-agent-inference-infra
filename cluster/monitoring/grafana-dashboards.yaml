    {
      "uid": "gpu-router",
      "title": "04 - Router",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "schemaVersion": 41,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "",
      "tags": [
        "gpu-serving"
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "type": "text",
          "title": "About this dashboard",
          "options": {
            "mode": "markdown",
            "content": "**Purpose.** How requests are spread across the two SGLang deployments and whether each deployment is healthy.\n\n**Placement.** `control/place.py`, policy `affload` (default): keep a session on the worker that served its previous call, unless that worker has 3 or more requests in flight than the other; batch goes to the least loaded worker. The hook rewrites the model to the per-worker alias (`qwen-coding-w0/w1`), so LiteLLM has one deployment to choose from; no retries (`num_retries: 0`). With `PLACEMENT_POLICY=litellm` LiteLLM's `least-busy` decides instead.\n\n**Where to point.** `control/place.py`, `cluster/litellm/config.yaml` (`router_settings`, `model_list`). Scrape: `litellm:4000/metrics` (`litellm_deployment_*`, `orch_placement_*`, `orch_hops_*`).\n\n**Hop / what is not copied.** A hop is a call served by a different worker than its session's previous call (src != dst); the destination reads the prefix from Mooncake (dashboard 07) instead of recomputing it. Only KV of cached prefixes (and the recurrent-state snapshot) is shared; weights and the in-flight decode state are never transferred."
          },
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 7
          }
        },
        {
          "type": "row",
          "title": "Distribution across workers",
          "collapsed": false,
          "panels": [],
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "timeseries",
          "title": "Requests / s per deployment",
          "description": "DEFINITION: Requests per second sent to each upstream SGLang deployment.\n\nWHY IT MATTERS: With `affload` the lines need not match (sessions stay where their history is); a persistent gap with idle capacity on the other worker means the slack (3) is too high.",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (api_base) (rate(litellm_litellm_deployment_total_requests_total[$__rate_interval]))",
              "legendFormat": "{{api_base}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 25,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
