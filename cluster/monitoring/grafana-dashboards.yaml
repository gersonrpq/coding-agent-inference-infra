        "list": []
      },
      "links": [],
      "panels": [
        {
          "type": "text",
          "title": "About this dashboard",
          "options": {
            "mode": "markdown",
            "content": "**Purpose.** Are the pods alive, would we page someone, and what would we scale.\n\n**Scaling today.** None: v0.1.0 has a fixed pool of 2 workers (no autoscaling, decision 62) and no extra GPU capacity. If we scaled, the question is *which pool*: **prefill tokens** (prompt tokens/s, engine queue wait: scale when long uncached prompts queue) or **decode slots** (running requests, inter-token latency, KV: scale when slots or KV are full). Adding another replica of the same size does not help when the cache is full of unique prefixes. Both signals are below.\n\n**Alerts.** The four rules of `cluster/monitoring/alert-rules.yaml` (loaded by Prometheus; visible at `/alerts`; no Alertmanager, so nothing is sent). The four stat panels below evaluate the same conditions (red = it would fire), and the last panel of the section shows the alert states Prometheus keeps.\n\n**Not covered here:** per-pod CPU/memory of the SGLang workers and replica counts (no kube-state-metrics / cAdvisor is scraped); only the LiteLLM process exposes its own CPU and memory."
          },
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 8
          }
        },
        {
          "type": "row",
          "title": "Alerts (red = would fire; same conditions as cluster/monitoring/alert-rules.yaml)",
          "collapsed": false,
          "panels": [],
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "stat",
          "title": "ALERT capacity shed rate",
          "description": "DEFINITION: 1 if more than 5 % of requests are refused for capacity (the 14-request cap, queue_full, or kv_pressure); rule CapacityShedRateHigh, for 5 m.\n\nWHY IT MATTERS: The fleet is at its limit: look at KV, the in-flight cap and the overflow share; do not lengthen the queue.",
          "targets": [
            {
              "refId": "A",
              "expr": "((sum(rate(litellm_orch_requests_shed_total{reason=\"kv_pressure\"}[5m])) + sum(rate(litellm_litellm_admission_rejected_requests_total{reason=\"queue_full\"}[5m]))) / clamp_min(sum(rate(litellm_orch_requests_shed_total[5m])) + sum(rate(litellm_orch_requests_admitted_total[5m])) + sum(rate(litellm_litellm_admission_rejected_requests_total[5m])), 0.001)) > bool 0.05",
              "legendFormat": "",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
