            "mode": "markdown",
            "content": "**Purpose.** The three different places a request can wait, per pod, so a delay can be attributed to the right layer.\n\n1. **In-flight cap** (LiteLLM's admission middleware): the gateway holds nothing; it counts 12 + K requests and refuses the next one at once.\n2. **Engine waiting queue** (SGLang `num_queue_reqs`): accepted by the engine, not yet scheduled; ordered by priority (`--enable-priority-scheduling`).\n3. **Engine running** (`num_running_reqs`): on the GPU, in the continuous batch.\n\n**Scheduler boundary.** The gateway only decides *whether* and *where* a request enters. Batching, prefill/decode interleaving, radix cache, KV allocation and retraction are SGLang's scheduler: this repo does not re-implement them.\n\n**Where to point.** Engine flags in `cluster/sglang/worker-*.yaml` (`--max-running-requests`, `--chunked-prefill-size`, `--retraction-policy`). Scrape: `curl <worker>:30000/metrics | grep num_`."
