        {
          "type": "text",
          "title": "About this dashboard",
          "options": {
            "mode": "markdown",
            "content": "**Purpose.** One-screen health of the whole stack: is it up, how loaded is it, is KV memory safe, is the cache working.\n\n**Application.** A tool-using coding agent (Pi) calling an OpenAI-compatible endpoint. Each request has a *shared prefix* (system prompt + tool definitions, identical across requests, served from the radix/HiCache) and a *unique suffix* (repo files, conversation history, tool results). The cache-hit panels measure how much of each prompt is shared.\n\n**Where to point.** Engine flags and capacity knobs: `cluster/sglang/worker-*.yaml`, `cluster/sglang/config.yaml` (MAX_NUM_SEQS, MAX_MODEL_LEN, MAX_MEM_FRAC). Policy: `control/admission.py`. Gateway limits: `cluster/litellm/config.yaml`. Raw scrapes: `curl <worker>:30000/metrics` (engine), `litellm:4000/metrics` (gateway + `orch_*`), `mooncake-master:9003/metrics`.\n\n**What limits concurrency on this GPU?** The engine runs at most MAX_NUM_SEQS = 6 requests per worker (12 in the fleet) and the gateway admits 12 + K = 14. KV was the expected limiter, but in the measured runs it peaked at 55-60 % of the pool: the binding limit was the cost of each call under load (long prefills interleaving with decode, cache misses). See *KV used* here and *KV-implied concurrency ceiling* (dashboard 06)."
          },
          "id": 1,
          "datasource": {
