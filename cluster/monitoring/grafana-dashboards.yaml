    {
      "uid": "gpu-sglang-performance",
      "title": "06 - SGLang / Engine",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "schemaVersion": 41,
      "time": {
        "from": "now-30m",
