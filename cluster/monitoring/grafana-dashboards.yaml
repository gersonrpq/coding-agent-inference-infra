        {
          "type": "text",
          "title": "About this dashboard",
          "options": {
            "mode": "markdown",
            "content": "**Purpose.** The inference engine's own view: latency, throughput, cache and KV sizing. (The course template calls this the vLLM dashboard; this deployment uses SGLang.)\n\n**Shared vs unique tokens.** `prompt_tokens_total` is everything the agent sent; `cached_tokens_total` is the part served from cache (shared prefix: system prompt + tool definitions + earlier turns). The *uncached* remainder is the unique work done in prefill.\n\n**What limited concurrency on this GPU?** *KV-implied concurrency ceiling* below: KV capacity divided by the measured KV tokens per running request. Compare with MAX_NUM_SEQS: the smaller number is the real limit.\n\n**Cold replicas.** Do not quote TTFT right after a restart: weights loaded does not mean warm (cache empty, CUDA graphs, first-request costs).\n\n**Where to point.** `cluster/sglang/worker-*.yaml`, `cluster/sglang/config.yaml`. Scrape: `curl <worker>:30000/metrics`."
          },
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 8
          }
        },
        {
          "type": "row",
          "title": "Latency",
          "collapsed": false,
          "panels": [],
          "id": 2,
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 1
          }
        },
        {
          "type": "timeseries",
          "title": "TTFT p50 / p95 / p99 per worker",
          "description": "DEFINITION: Time from request arrival to the first generated token, per worker (SGLang histogram).\n\nWHY IT MATTERS: The interactive latency SLO. Quote it only from a warm, steady-state run, and with the prompt/output token counts.",
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le, worker) (rate(sglang:time_to_first_token_seconds_bucket[$__rate_interval])))",
              "legendFormat": "w{{worker}} p50",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le, worker) (rate(sglang:time_to_first_token_seconds_bucket[$__rate_interval])))",
              "legendFormat": "w{{worker}} p95",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le, worker) (rate(sglang:time_to_first_token_seconds_bucket[$__rate_interval])))",
              "legendFormat": "w{{worker}} p99",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
