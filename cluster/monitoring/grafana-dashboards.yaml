        {
          "type": "text",
          "title": "About this dashboard",
          "options": {
            "mode": "markdown",
            "content": "**Purpose.** Every request outcome, split by *who refused it and why*.\n\n**Status code contract.** `429` = a limit of the caller's own key (LiteLLM virtual keys: max_parallel_requests, tpm, rpm) or LiteLLM's parallel-request limit: the caller should back off, it **never** overflows. `503` = capacity (hook shed or LiteLLM queue middleware): the only code allowed to overflow to the external API. `500`/OOM stay local.\n\n**Two sources of 503.** LiteLLM's queue middleware (`litellm_admission_rejected_requests_total`, rejects *before* the proxy route, so it is absent from `proxy_total_requests`) and our hook (`orch_requests_shed_total`, `control/admission.py`).\n\n**Where to point.** `cluster/litellm/config.yaml` (max_parallel_requests, max_in_flight/queued), `control/admission.py` (HTTPException 503), `control/inspect.py` (fail-closed 503). Scrape: `litellm:4000/metrics`."
          },
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 7
