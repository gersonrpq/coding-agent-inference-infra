    {
      "uid": "gpu-gateway-admission",
      "title": "03 - Gateway & Admission",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5s",
      "schemaVersion": 41,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "",
      "tags": [
        "gpu-serving"
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "type": "text",
          "title": "About this dashboard",
          "options": {
            "mode": "markdown",
            "content": "**Purpose.** What the gateway let in, queued or refused, *why*, and the signals it decided on.\n\n**Pipeline.** LiteLLM auth \u2192 `control/inspect.py` (guard: model, roles, content parts, tools, output cap) \u2192 `control/admission.py` (checks, batch share, placement) \u2192 SGLang; the in-flight cap is LiteLLM's own middleware.\n\n**A cap, not a queue.** The gateway admits 14 requests at once: 12 running (2 workers \u00d7 MAX_NUM_SEQS) plus a queue allowance K = 2 that waits in SGLang's priority queue; the next request is refused at once by LiteLLM's admission middleware (503 `queue_full`). Nothing waits at the gateway. Targets: interactive TTFT p99 <= 20 s (the SLO, measured and bounded by K = 2; a first-token cut was removed because it breaks long tool calls), batch 120 s.\n\n**Shed reasons:** 503 (the only code that may overflow): `queue_full` (the 14-request cap, LiteLLM's middleware), `kv_pressure` (KV \u2265 95% and the system-prompt+tools prefix was not seen recently), `batch_pressure` (fleet TTFT p99 > 4\u00d7 p50 over the last 60 s: batch is sacrificed first), `timeout_queue` (optional estimate, off by default). 429 (never overflows): a virtual key over its limit (LiteLLM). `no_healthy_worker` is answered by placement; a stale snapshot is only reported, never a shed (decision 62).\n\n**Where to point.** Policy: `control/admission.py`; placement: `control/place.py`; inputs: `control/fleet_state.py` (cached FleetSnapshot, never Prometheus per request). Scrape: `litellm:4000/metrics`, series `orch_*`. LiteLLM's own admission middleware is only a safety net (limits above capacity).\n\n**Where does the engine scheduler sit?** Below this layer (dashboards 05/06): the gateway admits, queues and refuses; SGLang schedules, batches and retracts, using the priority forwarded in each request."
          },
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 10
          }
        },
        {
          "type": "row",
          "title": "Gateway state",
