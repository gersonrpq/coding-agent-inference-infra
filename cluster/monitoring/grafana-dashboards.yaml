    {
      "uid": "gpu-mooncake-kv",
      "title": "07 - Mooncake KV",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "schemaVersion": 41,
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "",
      "tags": [
        "gpu-serving"
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "type": "text",
          "title": "About this dashboard",
          "options": {
            "mode": "markdown",
            "content": "**Purpose.** The shared KV store (our hop store) and the cache hierarchy feeding it: GPU radix (L1) \u2192 host RAM (L2) \u2192 Mooncake (L3).\n\n**What moves.** SGLang HiCache publishes KV pages to Mooncake as they are written (`write_through`) and loads them into another worker's cache instead of recomputing the prefix. KV *tensors of cached prefixes* are the only thing shared: model weights and the decode state of running requests are never copied. This is not prefill/decode disaggregation.\n\n**Eviction.** The Mooncake master evicts above `--eviction_high_watermark_ratio 0.95`. A worker's cache index can still reference a prefix whose KV was evicted (a 'ghost'); the symptom is load-back/get misses after evictions. SGLang's radix tree evicts with LRU.\n\n**Hops** are recorded by the gateway (`orch_hops_*`, dashboard 04); the load-back and backup panels here are the engine's side of the same event. A prefix is reusable on the other worker only after its KV pages and a recurrent-state snapshot are in Mooncake.\n\n**Where to point.** `cluster/mooncake/master.yaml`, HiCache flags in `cluster/sglang/worker-*.yaml`. Scrape: `mooncake-master:9003/metrics`."
          },
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 9
          }
        },
        {
          "type": "row",
          "title": "Pool capacity",
