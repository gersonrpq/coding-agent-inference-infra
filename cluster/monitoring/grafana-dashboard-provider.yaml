apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: gpu-serving
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: gpu-serving
        orgId: 1
        folder: GPU Serving
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
