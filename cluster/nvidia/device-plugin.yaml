apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system

  labels:
    app.kubernetes.io/name: nvidia-device-plugin

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
        app.kubernetes.io/component: device-plugin

    spec:
      priorityClassName: system-node-critical

      tolerations:
        - operator: Exists

      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.4

          # only when using less gpu for developing
          args:
            - --config-file=/config/config.yaml

          env:
            - name: DEVICE_LIST_STRATEGY
              value: envvar

            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi

          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins

            # only when using less gpu for developing
            - name: config
              mountPath: /config

      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory

        # only when using less gpu for developing
        - name: config
          configMap:
            name: nvidia-device-plugin-config

      # No hace falta poner runtimeClassName:
      # K3s ya tiene NVIDIA como default runtime.

  updateStrategy:
    type: RollingUpdate
