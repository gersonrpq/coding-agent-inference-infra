apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system

  labels:
    app.kubernetes.io/name: nvidia-device-plugin

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
        app.kubernetes.io/component: device-plugin

    spec:
      priorityClassName: system-node-critical

      tolerations:
        - operator: Exists

      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.4

          env:
            # setup/mig.sh splits the H100 into 2 x 3g.40gb; each MIG instance is advertised as one nvidia.com/gpu.
            - name: MIG_STRATEGY
              value: single
            # needed to read MIG instance memory
            - name: NVIDIA_MIG_MONITOR_DEVICES
              value: all

            - name: DEVICE_LIST_STRATEGY
              value: envvar

            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility

          securityContext:
            # MIG discovery needs /dev/nvidia-caps; CAP_SYS_ADMIN alone was not enough on K3s
            privileged: true

          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 200Mi

          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins

      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory

      # no runtimeClassName: K3s already uses the NVIDIA runtime by default

  updateStrategy:
    type: RollingUpdate
