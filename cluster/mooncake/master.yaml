apiVersion: apps/v1
kind: Deployment
metadata:
  name: mooncake-master
  namespace: gpu-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mooncake-master
  template:
    metadata:
      labels:
        app: mooncake-master
    spec:
      containers:
        - name: mooncake-master
          image: lmsysorg/sglang:latest
          command: ["mooncake_master"]
          args:
            - "--enable_http_metadata_server"
            - "true"
            - "--http_metadata_server_port"
            - "8080"
            - "--eviction_high_watermark_ratio"
            - "0.95"
            - "--rpc_port"
            - "50051"
            - "--rpc_address"
            - $(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          ports:
            - containerPort: 50051
            - containerPort: 8080
            - containerPort: 9003
---
apiVersion: v1
kind: Service
metadata:
  name: mooncake-master
  namespace: gpu-serving
spec:
  selector:
    app: mooncake-master
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metadata
      port: 8080
      targetPort: 8080
    - name: service
      port: 9003
      targetPort: 9003

