apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: gpu-serving
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: SUPERLINKED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: SUPERLINKED_API_KEY
            - name: PYTHONPATH
              value: /app/security 
            - name: SGLANG_REPLICA_URLS
              value: "http://sglang-worker-0:30000,http://sglang-worker-1:30001"
            - name: LITELLM_WORKER_STARTUP_HOOKS
              value: "security.admission:litellm_worker_startup"
            - name: FLEET_LOG_DEBUG
              value: "true"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: security
              mountPath: /app/security
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config

        - name: security
          configMap:
            name: litellm-security
