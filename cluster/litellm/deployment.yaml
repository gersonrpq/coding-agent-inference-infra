apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: gpu-serving
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm@sha256:a69f5f0c56b868d2fdfce7abfb037fed947b70ede202047ffc19c14dc96ab90a   # litellm 1.105.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: LITELLM_MASTER_KEY
            - name: SUPERLINKED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: SUPERLINKED_API_KEY
            - name: DATABASE_URL             # PostgreSQL: virtual keys per tenant, their limits and spend (cluster/postgres)
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: DATABASE_URL
            - name: PYTHONPATH
              value: /app/security 
            - name: SGLANG_REPLICA_URLS
              value: "http://sglang-worker-0:30000,http://sglang-worker-1:30001"
            - name: LITELLM_WORKER_STARTUP_HOOKS
              value: "security.admission:litellm_worker_startup"
            - name: MAX_TOKENS_POLICY        # clamp = a request for more than the 4096-token cap is served with 4096 (decision 54); reject = answer 400
              value: "clamp"
            - name: ADMISSION_CHECKS         # stateless sheds that run first. timeout_queue (estimate from stale gauges) is off: the in-flight cap replaces it
              value: "kv_pressure,batch_pressure"
            - name: PLACEMENT_POLICY         # litellm = LiteLLM's routing_strategy decides; affload = control/place.py
              value: "affload"
            - name: PLACEMENT_SLACK          # affload: move a session only if its worker has this many more requests in flight
              value: "3"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: security
              mountPath: /app/security
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:                  # with PostgreSQL LiteLLM migrates its schema before it listens: allow up to ~7 minutes
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 10
            failureThreshold: 42
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: litellm-config

        - name: security
          configMap:
            name: litellm-security
