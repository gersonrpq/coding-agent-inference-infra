apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: gpu-serving
data:
  config.yaml: |

    # LiteLLM does auth, limits, metrics and execution; the policy is in control/ (callbacks below).
    model_list:
      # Two workers, one deployment each. The in-flight cap (12 running + K = 2 waiting = 14) is set in general_settings;
      # keep max_parallel_requests above it, or LiteLLM would answer 429 (which never overflows).
      - model_name: qwen-coding-local
        litellm_params:
          model: openai/Qwen/Qwen3.5-9B
          api_base: http://sglang-worker-0:30000/v1
          api_key: local-worker-0
          max_parallel_requests: 40
        model_info:
          mode: chat
          max_tokens: 65536
          max_input_tokens: 65536
          max_output_tokens: 4096
          # Cost in dollars of GPU time (3.29 USD/h split between the 2 workers, divided by tokens per second at saturation).
          # Provisional; derivation in ARCHITECTURE.md, Cost model.
          input_cost_per_token: 0.000000048
          cache_read_input_token_cost: 0.000000009
          output_cost_per_token: 0.00000159

      - model_name: qwen-coding-local
        litellm_params:
          model: openai/Qwen/Qwen3.5-9B
          api_base: http://sglang-worker-1:30001/v1
          api_key: local-worker-1
          max_parallel_requests: 40
        model_info:
          mode: chat
          max_tokens: 65536
          max_input_tokens: 65536
          max_output_tokens: 4096
          input_cost_per_token: 0.000000048
          cache_read_input_token_cost: 0.000000009
          output_cost_per_token: 0.00000159

      # Per-worker aliases: place.py rewrites the model to one of these to choose the worker.
      - model_name: qwen-coding-w0
        litellm_params:
          model: openai/Qwen/Qwen3.5-9B
          api_base: http://sglang-worker-0:30000/v1
          api_key: local-worker-0
          max_parallel_requests: 40
        model_info:
          mode: chat
          max_tokens: 65536
          max_input_tokens: 65536
          max_output_tokens: 4096
          input_cost_per_token: 0.000000048
          cache_read_input_token_cost: 0.000000009
          output_cost_per_token: 0.00000159

      - model_name: qwen-coding-w1
        litellm_params:
          model: openai/Qwen/Qwen3.5-9B
          api_base: http://sglang-worker-1:30001/v1
          api_key: local-worker-1
          max_parallel_requests: 40
        model_info:
          mode: chat
          max_tokens: 65536
          max_input_tokens: 65536
          max_output_tokens: 4096
          input_cost_per_token: 0.000000048
          cache_read_input_token_cost: 0.000000009
          output_cost_per_token: 0.00000159

      # Overflow: external model, used only on 503/529 (never 429). Forwarding is off (fallbacks below are commented out).
      - model_name: qwen-coding-overflow
        litellm_params:
          model: openai/Qwen/Qwen3.8-27B-FP8
          api_base: https://api.superlinked.com/v1
          api_key: os.environ/SUPERLINKED_API_KEY
        model_info:
          mode: chat
          max_tokens: 65536
          max_input_tokens: 65536
          max_output_tokens: 4096
          input_cost_per_token: 0.00000025
          output_cost_per_token: 0.000002

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      allow_requests_on_db_unavailable: true
      enforce_user_param: false
      cancel_on_disconnect: true
      disable_retry_on_max_parallel_request_limit_error: true

      # Cap on requests in flight: 12 running + K = 2 waiting in SGLang's queue; the next one gets a 503 at once (decision 42, 55).
      max_in_flight_requests_per_worker: 14
      max_queued_requests_per_worker: 0
      admission_queue_timeout_seconds: 10.0
      global_max_parallel_requests: 128

    litellm_settings:
      drop_params: false
      callbacks:
        - prometheus
        - security_inspect.security_inspect
        - admission.admission_handler
      success_callback:
        - prometheus
      failure_callback:
        - prometheus

    router_settings:
      routing_strategy: least-busy   # only used when PLACEMENT_POLICY=litellm; place.py normally picks the worker by alias
      num_retries: 0
      timeout: 300   # ceiling only; the 20 s first-token target is bounded by K = 2, not by a timer (decisions 59, 61)
      # fallbacks: [{qwen-coding-local: [qwen-coding-overflow]}]   # enable to turn forwarding on
      default_max_parallel_requests: 12
      enable_pre_call_checks: true   # context-window check

    telemetry:
      enabled: false
