# One Deployment per worker, each pinned to one MIG instance. worker-1.yaml differs only in name, label, port and CUDA_VISIBLE_DEVICES.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-worker-1
  namespace: gpu-serving
  labels:
    app.kubernetes.io/name: sglang
    app.kubernetes.io/component: worker
    serving.gpu-worker: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate   # one GPU and one host port per pod: stop the old pod first
  selector:
    matchLabels:
      app.kubernetes.io/name: sglang
      serving.gpu-worker: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sglang
        app.kubernetes.io/component: worker
        serving.gpu-worker: "1"
    spec:
      hostNetwork: true   # Mooncake over RDMA: the workers share the host network, so each needs its own port
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60
      containers:
        - name: sglang
          image: lmsysorg/sglang@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469
          imagePullPolicy: IfNotPresent
          command: [sglang, serve]
          args:
            - --model-path
            - $(MODEL_NAME)
            - --host
            - 0.0.0.0
            - --port
            - "30001"
            - --context-length
            - $(MAX_MODEL_LEN)
            - --max-running-requests
            - $(MAX_NUM_SEQS)
            - --max-queued-requests
            - "$(MAX_QUEUED_REQUESTS)"
            - --chunked-prefill-size
            - "$(CHUNKED_PREFILL_SIZE)"
            - --reasoning-parser
            - "qwen3"
            - --tool-call-parser
            - "qwen3_coder"
            - --enable-metrics
            # prefill CUDA graphs cost 5.4 GB and 209 s per worker and add little with chunked prefill
            - --cuda-graph-backend-prefill
            - "disabled"
            - --kv-cache-dtype
            - $(KV_CACHE_DTYPE)
            - --mamba-full-memory-ratio
            - $(MAMBA_FULL_MEMORY_RATIO)
            - --mem-fraction-static
            - $(MAX_MEM_FRAC)
            # priority scheduling: lower number = more urgent (interactive <= 5, batch > 5)
            - --enable-priority-scheduling
            - --schedule-low-priority-values-first
            - --default-priority-value
            - "5"
            - --retraction-policy
            - "priority"
            # HiCache: GPU (L1) -> host RAM (L2) -> Mooncake (L3, shared by both workers)
            - --enable-hierarchical-cache
            - --enable-cache-report
            - --hicache-size
            - "32"
            - --hicache-write-policy
            - $(HICACHE_WRITE_POLICY)
            - --hicache-storage-backend
            - mooncake
            - --hicache-storage-backend-extra-config
            - '{"master_server_address":"mooncake-master:50051","metadata_server":"http://mooncake-master:8080/metadata","protocol":"rdma","device_name":"mlx5_0","global_segment_size":"16gb","tenant_id":"sglang"}'
            - --radix-eviction-policy
            - $(RADIX_EVICTION_POLICY)
          envFrom:
            - configMapRef:
                name: sglang-config
          env:
            - name: HF_HOME
              value: /models/huggingface
            # privileged pods see both MIG instances: pin this worker's instance by index
            - name: CUDA_VISIBLE_DEVICES
              value: "1"
          ports:
            - name: http
              containerPort: 30001
              protocol: TCP
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: infiniband
              mountPath: /dev/infiniband
          # /health answers after the model is loaded; the 1-token generation it runs needs a long timeout
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            privileged: true
      volumes:
        - name: model-cache
          hostPath:
            path: /var/lib/gpu-serving/huggingface
            type: DirectoryOrCreate
        - name: infiniband
          hostPath:
            path: /dev/infiniband
            type: Directory
