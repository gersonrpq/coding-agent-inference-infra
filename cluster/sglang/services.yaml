apiVersion: v1
kind: Service
metadata:
  name: sglang-worker-0
  namespace: gpu-serving
  labels:
    app.kubernetes.io/name: sglang
    serving.gpu-worker: "0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sglang
    serving.gpu-worker: "0"
  ports:
    - name: http
      port: 30000
      targetPort: http
      protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: sglang-worker-1
  namespace: gpu-serving
  labels:
    app.kubernetes.io/name: sglang
    serving.gpu-worker: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sglang
    serving.gpu-worker: "1"
  ports:
    - name: http
      port: 30001
      targetPort: http
      protocol: TCP
